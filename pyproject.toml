[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "multilingual-advanced-rag"
version = "0.1.0"
description = "Arabic and English research RAG with measurable hybrid retrieval"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
 "pydantic-settings>=2.6,<3", "python-dotenv>=1,<2", "pymupdf>=1.25,<2", "numpy>=1.26,<3",
 "faiss-cpu>=1.9,<2", "rank-bm25>=0.2.2,<0.3", "httpx>=0.27,<1",
 "streamlit>=1.40,<2"
]
[project.optional-dependencies]
models = ["torch>=2.5,<3", "transformers>=4.51,<6", "sentence-transformers>=5,<6"]
evaluation = ["ragas>=0.3,<0.4", "langchain-ollama>=0.3,<0.4", "langchain-huggingface>=0.3,<0.4", "langchain-community>=0.3,<0.4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["rag*", "api*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
