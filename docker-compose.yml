services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      RAG_DATA_DIR: /app/data/index
      RAG_EMBEDDING_BACKEND: ${RAG_EMBEDDING_BACKEND:-sentence-transformer}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      RAG_RERANKER_BACKEND: ${RAG_RERANKER_BACKEND:-cross-encoder}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      RAG_OLLAMA_URL: http://host.docker.internal:11434
      RAG_OLLAMA_MODEL: ${RAG_OLLAMA_MODEL:-qwen3:1.7b}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["corpus:/app/data/index", "model-cache:/app/.cache/huggingface"]
  ui:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=3)"]
    ports: ["127.0.0.1:8501:8501"]
    environment:
      RAG_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
volumes:
  corpus:
  model-cache:
